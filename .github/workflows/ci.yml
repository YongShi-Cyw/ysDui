name: ysDui CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  portable:
    name: Portable (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
          - compiler: Clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          if [ "${{ matrix.compiler }}" = "Clang" ]; then
            sudo apt-get install -y clang
          fi
      - name: Check patch whitespace
        # 根提交没有 HEAD^（例如独立仓库首次同步）：跳过，避免整 job 假失败。
        run: |
          if git rev-parse --verify --quiet HEAD^ >/dev/null; then
            git diff --check HEAD^ HEAD
          else
            echo "Root commit: skip patch whitespace check"
          fi
      - name: Configure
        run: >-
          cmake -S . -B build-portable -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DYSDUI_BUILD_WIN32_BACKEND=OFF
          -DYSDUI_BUILD_EXAMPLES=OFF
          -DYSDUI_BUILD_RESOURCE_MODULE=OFF
          -DYSDUI_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-portable --parallel
      - name: Test
        run: ctest --test-dir build-portable --output-on-failure

  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build-windows -A x64
          -DYSDUI_BUILD_WIN32_BACKEND=ON
          -DYSDUI_BUILD_EXAMPLES=ON
          -DYSDUI_BUILD_RESOURCE_MODULE=OFF
          -DYSDUI_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-windows --config Release --parallel
      - name: Test
        run: ctest --test-dir build-windows -C Release --output-on-failure

  performance:
    name: Windows Performance Regression
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select baseline commit
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            $baseline = "${{ github.event.pull_request.base.sha }}"
          } elseif (git rev-parse --verify --quiet HEAD^) {
            $baseline = "HEAD^"
          } else {
            # 根提交无父节点：与自身对比，回归阈值为 0，仅验证基线可运行。
            $baseline = "HEAD"
          }
          $baselineSha = git rev-parse $baseline
          "YSDUI_PERFORMANCE_BASE_SHA=$baselineSha" >> $env:GITHUB_ENV
      - name: Check out baseline source
        shell: pwsh
        run: |
          $baselineSource = Join-Path $env:RUNNER_TEMP "ysdui-performance-base"
          git worktree add --detach $baselineSource $env:YSDUI_PERFORMANCE_BASE_SHA
          "YSDUI_PERFORMANCE_BASE_SOURCE=$baselineSource" >> $env:GITHUB_ENV
      - name: Configure current and baseline
        shell: pwsh
        run: |
          cmake -S . -B build-performance-current -A x64 `
            -DYSDUI_BUILD_WIN32_BACKEND=ON `
            -DYSDUI_BUILD_EXAMPLES=OFF `
            -DYSDUI_BUILD_RESOURCE_MODULE=OFF `
            -DYSDUI_WARNINGS_AS_ERRORS=ON
          $baselineBuild = Join-Path $env:RUNNER_TEMP "ysdui-performance-base-build"
          cmake -S $env:YSDUI_PERFORMANCE_BASE_SOURCE -B $baselineBuild -A x64 `
            -DYSDUI_BUILD_WIN32_BACKEND=ON `
            -DYSDUI_BUILD_EXAMPLES=OFF `
            -DYSDUI_BUILD_RESOURCE_MODULE=OFF `
            -DYSDUI_WARNINGS_AS_ERRORS=ON
          "YSDUI_PERFORMANCE_BASE_BUILD=$baselineBuild" >> $env:GITHUB_ENV
      - name: Build current and baseline
        shell: pwsh
        run: |
          cmake --build build-performance-current --config Release `
            --target ysdui_performance_baseline --parallel
          cmake --build $env:YSDUI_PERFORMANCE_BASE_BUILD --config Release `
            --target ysdui_performance_baseline --parallel
      - name: Collect alternating samples
        shell: pwsh
        run: |
          $resultRoot = Join-Path $env:RUNNER_TEMP "ysdui-performance-results"
          $baselineResults = Join-Path $resultRoot "baseline"
          $currentResults = Join-Path $resultRoot "current"
          New-Item -ItemType Directory -Path $baselineResults, $currentResults | Out-Null
          $baselineExecutable = Join-Path $env:YSDUI_PERFORMANCE_BASE_BUILD `
            "Release/ysdui_performance_baseline.exe"
          $currentExecutable = Join-Path $pwd `
            "build-performance-current/Release/ysdui_performance_baseline.exe"
          1..5 | ForEach-Object {
            $baselineOutput = Join-Path $baselineResults "run-$_.txt"
            $currentOutput = Join-Path $currentResults "run-$_.txt"
            if ($_ % 2 -eq 0) {
              & $currentExecutable | Out-File -Encoding utf8 $currentOutput
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & $baselineExecutable | Out-File -Encoding utf8 $baselineOutput
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } else {
              & $baselineExecutable | Out-File -Encoding utf8 $baselineOutput
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & $currentExecutable | Out-File -Encoding utf8 $currentOutput
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          "YSDUI_PERFORMANCE_BASE_RESULTS=$baselineResults" >> $env:GITHUB_ENV
          "YSDUI_PERFORMANCE_CURRENT_RESULTS=$currentResults" >> $env:GITHUB_ENV
      - name: Enforce 15 percent regression limit
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          if ($env:YSDUI_PERFORMANCE_BASE_SHA -eq $head) {
            # 根提交无父节点时 baseline=HEAD：与自身对比只有噪声，跳过阈值门禁。
            Write-Host "Baseline equals HEAD ($head): skip regression gate"
            exit 0
          }
          cmake `
            "-DBASELINE_DIR=$env:YSDUI_PERFORMANCE_BASE_RESULTS" `
            "-DCURRENT_DIR=$env:YSDUI_PERFORMANCE_CURRENT_RESULTS" `
            -DTHRESHOLD_PERCENT=15 `
            -P cmake/compare_performance_baselines.cmake

  windows-code-analysis:
    name: Windows MSVC Code Analysis
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build-windows-analysis -A x64
          -DYSDUI_BUILD_TESTS=OFF
          -DYSDUI_BUILD_EXAMPLES=OFF
          -DYSDUI_BUILD_RESOURCE_MODULE=OFF
          -DYSDUI_WARNINGS_AS_ERRORS=ON
          -DYSDUI_ENABLE_MSVC_ANALYZE=ON
      - name: Analyze project sources
        run: cmake --build build-windows-analysis --config Release --target ysdui_platform_win32 --parallel

  resource:
    name: Resource (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset resource
      - name: Build
        run: cmake --build --preset resource --parallel
      - name: Test
        run: ctest --preset resource -R "^(ysdui_install_consumer|ysdui_resource_package_tests)$"

  resource-encryption:
    name: Resource Encryption (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install vcpkg and libsodium
        shell: bash
        run: |
          # 钉死 2024.11.16：tip 上的某些 port 会强制 CMake 4.4+，ubuntu-24.04 自带 CMake 过旧会直接 BUILD_FAILED。
          vcpkg_root="$RUNNER_TEMP/vcpkg"
          git clone --depth 1 --branch 2024.11.16 https://github.com/microsoft/vcpkg "$vcpkg_root"
          "$vcpkg_root/bootstrap-vcpkg.sh" -disableMetrics
          "$vcpkg_root/vcpkg" install libsodium:x64-linux --clean-after-build
          echo "VCPKG_ROOT=$vcpkg_root" >> "$GITHUB_ENV"
      - name: Configure
        run: >-
          cmake -S . -B build-resource-sodium -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-linux
          -DYSDUI_BUILD_WIN32_BACKEND=OFF
          -DYSDUI_BUILD_EXAMPLES=OFF
          -DYSDUI_BUILD_RESOURCE_MODULE=ON
          -DYSDUI_ENABLE_RESOURCE_ENCRYPTION=ON
          -DYSDUI_BUILD_PERFORMANCE_BASELINE=OFF
          -DYSDUI_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-resource-sodium --parallel
      - name: Test
        run: ctest --test-dir build-resource-sodium -R "^(ysdui_install_consumer|ysdui_resource_package_tests)$" --output-on-failure

  clang-tidy:
    name: Clang-Tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy ripgrep
      - name: Configure compilation database
        run: >-
          cmake -S . -B build-tidy -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DYSDUI_BUILD_WIN32_BACKEND=OFF
          -DYSDUI_BUILD_EXAMPLES=OFF
          -DYSDUI_BUILD_RESOURCE_MODULE=OFF
      - name: Analyze project sources
        # resource / RichDocumentJson 在未开模块或不完整类型下会让 tidy hard-error；
        # 历史告警数量大，本步先作门禁采集（不阻断），专项清理后再改回严格失败。
        run: |
          set +e
          rg --files src -g '*.cpp' \
            -g '!src/platform/win32/**' \
            -g '!src/resource/**' \
            -g '!src/controls/input/DuiRichDocumentJson.cpp' \
            | xargs -r clang-tidy -p build-tidy --quiet
          exit 0


  portable-sanitizers:
    name: Portable Clang ASan UBSan
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Configure
        run: cmake --preset portable-clang-sanitizers
      - name: Build
        run: cmake --build --preset portable-clang-sanitizers --parallel
      - name: Test
        run: ctest --preset portable-clang-sanitizers

  windows-asan:
    name: Windows MSVC ASan
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-msvc-asan
      - name: Build
        run: cmake --build --preset windows-msvc-asan --parallel
      - name: Test
        run: ctest --preset windows-msvc-asan
